version: 2.1

jobs:
  build-test:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: postgresql://appuser:devpassword@localhost:5432/leaderboard
          REDIS_URL: redis://localhost:6379/0

      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: leaderboard

      - image: cimg/redis:7.2

    steps:
      - checkout

      - run:
          name: Install dependencies and tools
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest pytest-cov ruff redis

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 60); do
              if pg_isready -h localhost -p 5432 -U appuser; then
                break
              fi
              sleep 2
            done
            pg_isready -h localhost -p 5432 -U appuser

      - run:
          name: Wait for Redis
          command: |
            python - <<'PY'
            import socket
            import time

            for attempt in range(60):
                try:
                    with socket.create_connection(("localhost", 6379), timeout=2):
                        print("Redis is ready")
                        break
                except OSError:
                    if attempt == 59:
                        raise
                    time.sleep(2)
            PY

      - run:
          name: Apply database migrations
          command: |
            for file in migrations/*.sql; do
              PGPASSWORD=devpassword psql \
                -h localhost \
                -p 5432 \
                -U appuser \
                -d leaderboard \
                -v ON_ERROR_STOP=1 \
                -f "$file"
            done

      - run:
          name: Run Ruff lint
          command: ruff check app tests

      - run:
          name: Run tests with coverage
          command: python -m pytest tests --cov=app --cov-report=term-missing

  build-and-push:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Verify Docker Hub credentials
          command: |
            set -eu
            test -n "$DOCKERHUB_USERNAME"
            test -n "$DOCKERHUB_TOKEN"
            echo "Docker Hub variables are configured."

      - run:
          name: Log in to Docker Hub
          command: |
            set -eu
            printf '%s' "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - run:
          name: Build Docker image
          command: |
            set -eu
            IMAGE_NAME="${DOCKERHUB_USERNAME}/study-leaderboard-python"

            docker build \
              -t "${IMAGE_NAME}:${CIRCLE_SHA1}" \
              -t "${IMAGE_NAME}:latest" \
              .

      - run:
          name: Push Docker image
          command: |
            set -eu
            IMAGE_NAME="${DOCKERHUB_USERNAME}/study-leaderboard-python"

            docker push "${IMAGE_NAME}:${CIRCLE_SHA1}"
            docker push "${IMAGE_NAME}:latest"

workflows:
  build-test-and-publish:
    jobs:
      - build-test

      - build-and-push:
          requires:
            - build-test
          filters:
            branches:
              only: main