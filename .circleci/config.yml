
version: 2.1

jobs:
  lint-and-test:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: leaderboard
      - image: cimg/redis:7.2

    environment:
      DATABASE_URL: postgresql://appuser:devpassword@localhost:5432/leaderboard
      REDIS_URL: redis://localhost:6379/0

    steps:
      - checkout

      - run:
          name: Install system tools
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client redis-tools

      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest pytest-cov ruff

      - run:
          name: Wait for PostgreSQL and Redis
          command: |
            for i in $(seq 1 30); do
              pg_isready -h localhost -U appuser && break
              sleep 2
            done
            pg_isready -h localhost -U appuser

            for i in $(seq 1 30); do
              redis-cli -h localhost ping && break
              sleep 2
            done
            redis-cli -h localhost ping

      - run:
          name: Apply database migrations
          command: |
            for file in migrations/*.sql; do
              PGPASSWORD=devpassword psql \
                -h localhost -U appuser -d leaderboard \
                -v ON_ERROR_STOP=1 -f "$file"
            done

      - run:
          name: Ruff lint
          command: ruff check app tests

      - run:
          name: Run tests with coverage
          command: python -m pytest tests --cov=app --cov-report=term-missing

  build-and-push:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Check Docker Hub credentials
          command: |
            test -n "$DOCKERHUB_USERNAME"
            test -n "$DOCKERHUB_TOKEN"

            - run:
          name: Log in to Docker Hub
          command: |
            set -eo pipefail
            printf '%s' "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t "$DOCKERHUB_USERNAME/study-leaderboard-python:latest" \
              -t "$DOCKERHUB_USERNAME/study-leaderboard-python:$CIRCLE_SHA1" .

      - run:
          name: Push Docker image
          command: |
            docker push "$DOCKERHUB_USERNAME/study-leaderboard-python:latest"
            docker push "$DOCKERHUB_USERNAME/study-leaderboard-python:$CIRCLE_SHA1"

workflows:
  build-test:
    jobs:
      - lint-and-test
      - build-and-push:
          requires:
            - lint-and-test
          filters:
            branches:
              only: main