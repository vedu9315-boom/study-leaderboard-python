
version: 2.1

jobs:
  build-test-and-push:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: postgresql://appuser:devpassword@localhost:5432/leaderboard
          REDIS_URL: redis://localhost:6379/0

      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: leaderboard

      - image: cimg/redis:7.2

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest pytest-cov ruff "psycopg[binary]"

      - run:
          name: Wait for PostgreSQL and Redis
          command: |
            # Wait for PostgreSQL
            for i in $(seq 1 30); do
              if pg_isready -h localhost -p 5432 -U appuser; then
                break
              fi
              sleep 2
            done

            pg_isready -h localhost -p 5432 -U appuser

            # Wait for Redis using Python (redis-cli is not required)
            python - <<'PY'
            import socket
            import time

            for attempt in range(30):
                try:
                    with socket.create_connection(
                        ("localhost", 6379), timeout=2
                    ) as connection:
                        connection.sendall(b"*1\r\n$4\r\nPING\r\n")
                        response = connection.recv(1024)

                        if b"+PONG" in response:
                            print("Redis is ready.")
                            break
                except OSError:
                    pass

                time.sleep(2)
            else:
                raise SystemExit("Redis did not become ready.")
            PY

      - run:
          name: Apply database migrations
          command: |
            for file in migrations/*.sql; do
              echo "Applying migration: $file"
              PGPASSWORD=devpassword psql \
                -h localhost \
                -p 5432 \
                -U appuser \
                -d leaderboard \
                -v ON_ERROR_STOP=1 \
                -f "$file"
            done

      - run:
          name: Ruff lint
          command: ruff check app tests

      - run:
          name: Run tests with coverage
          command: |
            python -m pytest tests \
              --cov=app \
              --cov-report=term-missing

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Verify Docker Hub variables
          command: |
            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "DOCKERHUB_USERNAME is missing."
              exit 1
            fi

            if [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "DOCKERHUB_TOKEN is missing."
              exit 1
            fi

            echo "Docker Hub variables are present."

      - run:
          name: Log in to Docker Hub
          command: |
            set +x
            printf '%s' "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t "$DOCKERHUB_USERNAME/study-leaderboard-python:latest" \
              .

      - run:
          name: Push Docker image
          command: |
            docker push \
              "$DOCKERHUB_USERNAME/study-leaderboard-python:latest"

workflows:
  build-test-and-publish:
    jobs:
      - build-test-and-push